main:
  push:
    - name: 构建 Lightrans 扩展
      docker:
        image: node:22
        volumes:
          - /root/.npm:copy-on-write
      imports:
        - https://cnb.cool/hin/env/-/blob/main/lightrans.yml
      stages:
        - name: 安装根目录依赖
          script: |
            npm install --legacy-peer-deps
        - name: 安装 translators 包依赖并构建
          script: |
            cd packages/translators
            npm install --legacy-peer-deps
            npm run build
            cd ../..
        - name: 安装 lightrans 包依赖并构建
          script: |
            cd packages/lightrans
            npm install --legacy-peer-deps
            npm run build
            cd ../..
        - name: 检查构建产物
          script: |
            ls -la packages/lightrans/build/
      artifacts:
        - packages/lightrans/build/lightrans_chrome.zip
        - packages/lightrans/build/lightrans_firefox.zip
    - name: 发布到 Release
      publish:
        - type: release
          name: Lightrans Release
          description: "Lightrans 浏览器扩展发布"
          version: "v0.0.1"
          artifacts:
            - packages/lightrans/build/lightrans_chrome.zip
            - packages/lightrans/build/lightrans_firefox.zip