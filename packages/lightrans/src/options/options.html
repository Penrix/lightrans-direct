<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title class="i18n" data-i18n-name="SettingsTitle"></title>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <link rel="icon" href="../icon/icon128.png" />
        <link type="text/css" rel="stylesheet" href="./options.css" />
    </head>

    <body>
        <div id="option">
            <header>
                <img src="../icon/icon128.png" />
                <span class="space"></span>
                <span class="space"></span>
                Lightrans Direct
            </header>

            <div class="content">
                <label class="setting-title">翻译服务（直连 SiliconFlow）</label>
                <div class="row">
                    <div class="column">
                        <label class="checked-label" style="justify-content: flex-start; gap: 8px;">
                            Provider：
                            <strong>SiliconFlow</strong>
                        </label>
                    </div>
                    <div class="column">
                        <label for="ai-model" class="checked-label" style="justify-content: flex-start; gap: 8px;">
                            翻译模型：
                            <select
                                id="ai-model"
                                setting-type="select"
                                setting-path="AIModel"
                                class="translator-config"
                            ></select>
                            <input
                                id="ai-model-input"
                                type="text"
                                setting-type="text"
                                setting-path="CustomModelName"
                                class="translator-config"
                                placeholder="输入 SiliconFlow 支持的模型 ID"
                                style="display: none; flex: 1 1 auto; min-width: 0;"
                            />
                            <span id="custom-model-col" style="margin-left: 8px;">
                                <input
                                    type="checkbox"
                                    id="custom-model"
                                    value="custom-model"
                                    setting-type="switch"
                                    setting-path="CustomModel"
                                />
                                <span class="space"></span>
                                自定义
                            </span>
                        </label>
                    </div>
                </div>

                <div class="row" id="apikey-row">
                    <div class="column" style="flex: 1 1 auto; min-width: 0;">
                        <label for="api-key" class="checked-label" style="justify-content: flex-start; gap: 8px; width: 100%;">
                            <span style="white-space: nowrap;">SiliconFlow API Key：</span>
                            <input
                                id="api-key"
                                type="password"
                                class="translator-config"
                                autocomplete="off"
                                spellcheck="false"
                                placeholder="仅保存在本机浏览器中的 SiliconFlow API Key"
                                style="flex: 1 1 auto; min-width: 0; width: 100%;"
                            />
                        </label>
                    </div>
                </div>
                <div class="row">
                    <div class="column" style="flex: 1 1 auto;">
                        <div style="font-size: 13px; opacity: 0.78; line-height: 1.55;">
                            网页文本直接发送到 SiliconFlow；本扩展不经过开发者中继服务器。API Key 只保存在本机 chrome.storage.local。
                        </div>
                    </div>
                </div>

                <label class="setting-title">术语注释</label>
                <div id="terminology-settings">
                    <div class="row">
                        <div class="column">
                            <input
                                type="checkbox"
                                setting-type="switch"
                                setting-path="GlossaryEnabled"
                                class="switch"
                                id="glossary-enabled"
                            />
                            <span class="space"></span>
                            <label for="glossary-enabled" class="checked-label">启用固定术语表</label>
                        </div>
                        <div class="column">
                            <input
                                type="checkbox"
                                setting-type="switch"
                                setting-path="AutoAnnotateTerms"
                                class="switch"
                                id="auto-annotate-terms"
                            />
                            <span class="space"></span>
                            <label for="auto-annotate-terms" class="checked-label">自动给英文软件名 / 技术词加中文注释</label>
                        </div>
                    </div>
                    <div class="row" style="padding-top: 2px; padding-bottom: 4px;">
                        <div class="column" style="flex: 1 1 auto; min-width: 0; max-width: 100%; display: block;">
                            <label for="glossary-text" class="checked-label" style="display: block; line-height: 1.4;">
                                固定术语表：每行 <code>原词 = 最终显示文本</code>
                            </label>
                            <textarea
                                id="glossary-text"
                                rows="2"
                                spellcheck="false"
                                placeholder="Obsidian = Obsidian（笔记与知识管理软件）"
                                style="width: 100%; height: 54px; min-height: 54px; max-height: 160px; box-sizing: border-box; margin-top: 4px; padding: 7px 10px; resize: vertical; border: 1px solid #d8dee8; border-radius: 8px; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;"
                            ></textarea>
                            <div style="display: flex; justify-content: space-between; gap: 12px; margin-top: 3px; font-size: 11px; opacity: 0.68; line-height: 1.35;">
                                <span>精确匹配；每次出现都按术语表展开。自动注释只补充表外术语。</span>
                                <span id="glossary-status" style="white-space: nowrap;"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <label for="layout-settings" class="setting-title i18n" data-i18n-name="LayoutSettings"></label>
                <div id="layout-settings">
                    <div class="row">
                        <div class="column">
                            <label class="checked-label" style="justify-content: flex-start; gap: 8px;">
                                页面翻译：
                                <select setting-type="select" setting-path="PageTranslationDisplayMode">
                                    <option value="original">仅原文</option>
                                    <option value="translated">仅译文</option>
                                    <option value="bilingual">对照（原文 + 译文）</option>
                                </select>
                            </label>
                        </div>
                        <div class="column">
                            <label
                                for="select-translate-position"
                                class="checked-label i18n"
                                data-i18n-name="SelectTranslatePosition"
                                data-insert-pos="afterBegin"
                            >
                                <select
                                    setting-type="select"
                                    id="select-translate-position"
                                    value="SelectTranslatePosition"
                                    setting-path="LayoutSettings SelectTranslatePosition"
                                >
                                    <option value="TopRight" data-i18n-name="TopRight" class="i18n"></option>
                                    <option value="TopLeft" data-i18n-name="TopLeft" class="i18n"></option>
                                    <option value="BottomRight" data-i18n-name="BottomRight" class="i18n"></option>
                                    <option value="BottomLeft" data-i18n-name="BottomLeft" class="i18n"></option>
                                </select>
                            </label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="column">
                            <input
                                type="checkbox"
                                value="resize"
                                setting-type="switch"
                                setting-path="LayoutSettings Resize"
                                class="switch"
                                id="Resize"
                            />
                            <span class="space"></span>
                            <label for="Resize" class="checked-label i18n" data-i18n-name="ResizeSetting"></label>
                        </div>
                        <div class="column">
                            <input
                                type="checkbox"
                                value="FoldLongContent"
                                setting-type="switch"
                                setting-path="LayoutSettings FoldLongContent"
                                class="switch"
                                id="FoldLongContent"
                            />
                            <span class="space"></span>
                            <label for="FoldLongContent" class="checked-label i18n" data-i18n-name="FoldLongContentSetting"></label>
                        </div>
                    </div>
                </div>

                <label for="other-settings" class="setting-title i18n" data-i18n-name="OtherSettings"></label>
                <div id="other-settings">
                    <div class="row">
                        <div class="column">
                            <input
                                type="checkbox"
                                setting-type="switch"
                                setting-path="OtherSettings MutualTranslate"
                                class="switch"
                                id="mutual-translate"
                            />
                            <span class="space"></span>
                            <label for="mutual-translate" class="checked-label i18n" data-i18n-name="MutualTranslation"></label>
                        </div>
                        <div class="column">
                            <input
                                type="checkbox"
                                setting-type="switch"
                                setting-path="OtherSettings SelectTranslate"
                                class="switch"
                                id="select-translate"
                            />
                            <span class="space"></span>
                            <label for="select-translate" class="checked-label i18n" data-i18n-name="SelectTranslate"></label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="column">
                            <input
                                type="checkbox"
                                setting-type="switch"
                                setting-path="OtherSettings UsePDFjs"
                                class="switch"
                                id="use-pdf-js"
                            />
                            <span class="space"></span>
                            <label for="use-pdf-js" class="checked-label i18n" data-i18n-name="UsePDFjs"></label>
                        </div>
                        <div class="column">
                            <input
                                type="checkbox"
                                setting-type="switch"
                                setting-path="OtherSettings TranslateAfterSelect"
                                class="switch"
                                id="translate-after-select"
                            />
                            <span class="space"></span>
                            <label for="translate-after-select" class="checked-label i18n" data-i18n-name="TranslateAfterSelect"></label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="column">
                            <input
                                type="checkbox"
                                setting-type="switch"
                                setting-path="OtherSettings TranslateAfterDblClick"
                                class="switch"
                                id="translate-after-dbl-click"
                            />
                            <span class="space"></span>
                            <label for="translate-after-dbl-click" class="checked-label i18n" data-i18n-name="TranslateAfterDblClick"></label>
                        </div>
                        <div class="column">
                            <input
                                type="checkbox"
                                setting-type="switch"
                                setting-path="OtherSettings CancelTextSelection"
                                class="switch"
                                id="cancel-text-selection"
                            />
                            <span class="space"></span>
                            <label for="cancel-text-selection" class="checked-label i18n" data-i18n-name="CancelTextSelection"></label>
                        </div>
                    </div>
                </div>
            </div>

            <footer>
                ©2026
                <a href="https://github.com/Penrix/lightrans-direct" target="_blank" rel="noopener noreferrer">Lightrans Direct</a>
                <span class="space"></span>
                · based on
                <a href="https://github.com/W4J1e/Lightrans" target="_blank" rel="noopener noreferrer">Lightrans</a>
                / EdgeTranslate
            </footer>
        </div>
    </body>

    <script src="./options.js"></script>
</html>
