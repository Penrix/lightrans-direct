<!DOCTYPE html>
<meta charset="utf-8" />
<html>
    <head>
        <link type="text/css" rel="stylesheet" href="./popup.css" />
    </head>

    <body>
        <div class="frame">
            <div class="row">
                <div class="col">
                    <div class="selection">
                        <select id="model" title="SiliconFlow 模型"></select>
                    </div>
                </div>
            </div>

            <button id="translatePage" type="button" title="使用当前 SiliconFlow 模型翻译当前网页">
                翻译当前网页
            </button>

            <div class="row">
                <div class="input-container">
                    <textarea id="translate_input" autofocus="autofocus"></textarea>
                    <button id="translateSubmit" title="翻译" class="arrow-button"></button>
                </div>
            </div>
            <label
                id="hint_message"
                class="i18n"
                for="translate_input"
                data-i18n-name="InputHint"
            ></label>

            <div id="setting" style="display: block;">
                <div class="row" style="align-items: flex-end">
                    <div class="col">
                        <div class="selection">
                            <select id="sl">
                                <option
                                    class="i18n"
                                    value="auto"
                                    data-i18n-name="AutoDetect"
                                ></option>
                            </select>
                        </div>
                    </div>
                    <i
                        class="translate-icon translate-icon-exchange"
                        id="exchange"
                        title="交换两种语言"
                    ></i>
                    <div class="col">
                        <div class="selection">
                            <select id="tl"></select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="result" class="result-container">
            <div id="translated-text"></div>
        </div>

        <footer>
            Lightrans Direct · SiliconFlow Direct
        </footer>
    </body>

    <script src="./popup.js"></script>
</html>
